  <text x="656" y="258" text-anchor="middle" font-size="18" font-weight="700" fill="#1B3A6B">夜曲</text>
  <text x="656" y="316" text-anchor="middle" font-size="14" fill="#1B3A6B">len = 3，重复项只留一份</text>
