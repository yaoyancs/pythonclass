<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="880" height="320" rx="24" fill="#F4F7FB"/>
  <rect x="24" y="20" width="400" height="280" rx="16" fill="#FFFFFF" stroke="#C45C26" stroke-width="2"/>
  <rect x="44" y="36" width="360" height="36" rx="8" fill="#FFF4EC"/>
  <text x="224" y="60" text-anchor="middle" font-size="17" font-weight="700" fill="#C45C26">列表：自下标 0 起逐项比较</text>
  <rect x="64" y="92" width="320" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="224" y="118" text-anchor="middle" font-size="16" fill="#475569">第 1 首  晴天</text>
  <rect x="64" y="144" width="320" height="40" rx="8" fill="#FFF4EC" stroke="#C45C26" stroke-width="2"/>
  <text x="224" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#C45C26">第 2 首  稻香（命中）</text>
  <rect x="64" y="196" width="320" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="224" y="222" text-anchor="middle" font-size="16" fill="#475569">第 3 首  夜曲</text>
  <text x="224" y="270" text-anchor="middle" font-size="14" fill="#C45C26">in / index：线性扫描</text>
  <rect x="456" y="20" width="400" height="280" rx="16" fill="#FFFFFF" stroke="#1B3A6B" stroke-width="2.5"/>
  <rect x="476" y="36" width="360" height="36" rx="8" fill="#E8EEF8"/>
  <text x="656" y="60" text-anchor="middle" font-size="17" font-weight="700" fill="#1B3A6B">字典：按歌名直接取时长</text>
  <rect x="496" y="100" width="140" height="48" rx="10" fill="#1B3A6B"/>
  <text x="566" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">稻香</text>
  <line x1="636" y1="124" x2="700" y2="124" stroke="#1B3A6B" stroke-width="3"/>
  <polygon points="700,118 714,124 700,130" fill="#1B3A6B"/>
  <rect x="720" y="100" width="110" height="48" rx="10" fill="#E8EEF8" stroke="#1B3A6B" stroke-width="2"/>
  <text x="775" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#1B3A6B">3:43</text>
  <text x="656" y="190" text-anchor="middle" font-size="15" fill="#1B3A6B">字典：durations["稻香"]</text>
  <text x="656" y="222" text-anchor="middle" font-size="15" fill="#1B3A6B">不必先 index，也不必让两列对齐</text>
  <text x="656" y="270" text-anchor="middle" font-size="14" fill="#1B3A6B">无需遍历，按标识直接取值</text>
</svg>
