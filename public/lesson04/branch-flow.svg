<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" font-family="PingFang SC, sans-serif">
  <rect width="420" height="560" rx="24" fill="#F4F7FB"/>
  <defs>
    <marker id="br-arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1B3A6B"/>
    </marker>
  </defs>

  <rect x="150" y="24" width="120" height="42" rx="21" fill="#E8EEF8" stroke="#1B3A6B" stroke-width="2.5"/>
  <text x="210" y="52" text-anchor="middle" font-size="22" font-weight="600" fill="#1B3A6B">开始</text>
  <line x1="210" y1="66" x2="210" y2="96" stroke="#1B3A6B" stroke-width="2.5" marker-end="url(#br-arr)"/>

  <rect x="95" y="98" width="230" height="48" rx="12" fill="#FFFFFF" stroke="#D5DDE8" stroke-width="2"/>
  <text x="210" y="129" text-anchor="middle" font-size="20" fill="#1B3A6B">读入成绩 score</text>
  <line x1="210" y1="146" x2="210" y2="176" stroke="#1B3A6B" stroke-width="2.5" marker-end="url(#br-arr)"/>

  <path d="M210,178 L275,230 L210,282 L145,230 Z" fill="#FFFFFF" stroke="#1B3A6B" stroke-width="2.5"/>
  <text x="210" y="222" text-anchor="middle" font-size="18" font-weight="600" fill="#1B3A6B">score</text>
  <text x="210" y="246" text-anchor="middle" font-size="18" font-weight="600" fill="#1B3A6B">≥ 60?</text>

  <text x="118" y="250" font-size="18" font-weight="700" fill="#1B3A6B">是</text>
  <path d="M145,230 H70 V320" fill="none" stroke="#1B3A6B" stroke-width="2.5" marker-end="url(#br-arr)"/>
  <rect x="20" y="322" width="100" height="56" rx="12" fill="#FFFFFF" stroke="#D5DDE8" stroke-width="2"/>
  <text x="70" y="356" text-anchor="middle" font-size="18" fill="#1B3A6B">输出：合格</text>

  <text x="288" y="250" font-size="18" font-weight="700" fill="#1B3A6B">否</text>
  <path d="M275,230 H350 V320" fill="none" stroke="#1B3A6B" stroke-width="2.5" marker-end="url(#br-arr)"/>
  <rect x="300" y="322" width="100" height="56" rx="12" fill="#FFFFFF" stroke="#D5DDE8" stroke-width="2"/>
  <text x="350" y="348" text-anchor="middle" font-size="17" fill="#1B3A6B">输出：</text>
  <text x="350" y="370" text-anchor="middle" font-size="17" fill="#1B3A6B">不合格</text>

  <path d="M70,378 V430 H350 V378" fill="none" stroke="#1B3A6B" stroke-width="2.5"/>
  <line x1="210" y1="430" x2="210" y2="468" stroke="#1B3A6B" stroke-width="2.5" marker-end="url(#br-arr)"/>
  <rect x="150" y="470" width="120" height="42" rx="21" fill="#E8EEF8" stroke="#1B3A6B" stroke-width="2.5"/>
  <text x="210" y="498" text-anchor="middle" font-size="22" font-weight="600" fill="#1B3A6B">结束</text>
</svg>
