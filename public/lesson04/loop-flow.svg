<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" font-family="PingFang SC, sans-serif">
  <rect width="420" height="560" rx="24" fill="#F4F7FB"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1B3A6B"/></marker>
    <marker id="arr-back" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#C45C26"/></marker>
  </defs>
  <rect x="150" y="20" width="120" height="40" rx="20" fill="#E8EEF8" stroke="#1B3A6B" stroke-width="2.5"/>
  <text x="210" y="46" text-anchor="middle" font-size="20" font-weight="600" fill="#1B3A6B">开始</text>
  <line x1="210" y1="60" x2="210" y2="88" stroke="#1B3A6B" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="105" y="90" width="210" height="44" rx="12" fill="#FFFFFF" stroke="#D5DDE8" stroke-width="2"/>
  <text x="210" y="118" text-anchor="middle" font-size="18" fill="#1B3A6B">初始化（如 i = 1）</text>
  <line x1="210" y1="134" x2="210" y2="162" stroke="#1B3A6B" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M210,164 L268,214 L210,264 L152,214 Z" fill="#FFFFFF" stroke="#1B3A6B" stroke-width="2.5"/>
  <text x="210" y="208" text-anchor="middle" font-size="17" font-weight="600" fill="#1B3A6B">条件</text>
  <text x="210" y="230" text-anchor="middle" font-size="17" font-weight="600" fill="#1B3A6B">成立?</text>
  <text x="228" y="286" font-size="16" font-weight="700" fill="#1B3A6B">是</text>
  <line x1="210" y1="264" x2="210" y2="300" stroke="#1B3A6B" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="110" y="302" width="200" height="44" rx="12" fill="#FFFFFF" stroke="#D5DDE8" stroke-width="2"/>
  <text x="210" y="330" text-anchor="middle" font-size="18" fill="#1B3A6B">执行循环体</text>
  <line x1="210" y1="346" x2="210" y2="374" stroke="#1B3A6B" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="105" y="376" width="210" height="44" rx="12" fill="#FFFFFF" stroke="#D5DDE8" stroke-width="2"/>
  <text x="210" y="404" text-anchor="middle" font-size="18" fill="#1B3A6B">更新（如 i += 1）</text>
  <path d="M105,398 H48 V214 H152" fill="none" stroke="#C45C26" stroke-width="4" marker-end="url(#arr-back)"/>
  <rect x="8" y="280" width="36" height="88" rx="10" fill="#FFF4EC" stroke="#C45C26" stroke-width="2"/>
  <text x="26" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#C45C26">返</text>
  <text x="26" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#C45C26">回</text>
  <text x="26" y="348" text-anchor="middle" font-size="15" font-weight="700" fill="#C45C26">判</text>
  <text x="26" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#C45C26">断</text>
  <text x="280" y="210" font-size="16" font-weight="700" fill="#1B3A6B">否</text>
  <line x1="268" y1="214" x2="340" y2="214" stroke="#1B3A6B" stroke-width="2.5"/>
  <line x1="340" y1="214" x2="340" y2="490" stroke="#1B3A6B" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="280" y="492" width="120" height="40" rx="20" fill="#E8EEF8" stroke="#1B3A6B" stroke-width="2.5"/>
  <text x="340" y="518" text-anchor="middle" font-size="20" font-weight="600" fill="#1B3A6B">结束</text>
</svg>
