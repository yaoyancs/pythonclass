<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 640" font-family="PingFang SC, sans-serif">
  <rect width="380" height="640" rx="20" fill="#F4F7FB"/>
  <defs>
    <marker id="fw-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1B3A6B"/></marker>
    <marker id="fw-b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#C45C26"/></marker>
    <marker id="fw-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F7A4D"/></marker>
  </defs>

  <text x="190" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1B3A6B">for + while</text>

  <rect x="140" y="38" width="100" height="30" rx="15" fill="#E8EEF8" stroke="#1B3A6B" stroke-width="2"/>
  <text x="190" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#1B3A6B">开始</text>
  <line x1="190" y1="68" x2="190" y2="86" stroke="#1B3A6B" stroke-width="2" marker-end="url(#fw-a)"/>

  <rect x="115" y="88" width="150" height="32" rx="10" fill="#FFF" stroke="#D5DDE8" stroke-width="1.5"/>
  <text x="190" y="109" text-anchor="middle" font-size="14" fill="#1B3A6B">读入 n</text>
  <line x1="190" y1="120" x2="190" y2="138" stroke="#1B3A6B" stroke-width="2" marker-end="url(#fw-a)"/>

  <rect x="24" y="140" width="332" height="430" rx="16" fill="#EAF3FF" stroke="#1B3A6B" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="40" y="162" font-size="13" font-weight="700" fill="#1B3A6B">外层 for：处理一名顾客</text>

  <rect x="90" y="176" width="200" height="30" rx="10" fill="#FFF" stroke="#D5DDE8"/>
  <text x="190" y="196" text-anchor="middle" font-size="14" fill="#1B3A6B">total = 0</text>
  <line x1="190" y1="206" x2="190" y2="224" stroke="#1B3A6B" stroke-width="2" marker-end="url(#fw-a)"/>

  <rect x="48" y="226" width="284" height="250" rx="14" fill="#FFF7F0" stroke="#C45C26" stroke-width="2.5"/>
  <text x="64" y="248" font-size="13" font-weight="700" fill="#C45C26">内层 while：扫码（可反复）</text>

  <rect x="95" y="262" width="190" height="30" rx="10" fill="#FFF" stroke="#D5DDE8"/>
  <text x="190" y="282" text-anchor="middle" font-size="14" fill="#1B3A6B">读入 price</text>
  <line x1="190" y1="292" x2="190" y2="312" stroke="#1B3A6B" stroke-width="2" marker-end="url(#fw-a)"/>

  <path d="M190,314 L228,344 L190,374 L152,344 Z" fill="#FFF" stroke="#1B3A6B" stroke-width="2"/>
  <text x="190" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="#1B3A6B">price==0?</text>

  <text x="240" y="340" font-size="13" font-weight="700" fill="#C45C26">否</text>
  <path d="M228,344 H290 V400 H210" fill="none" stroke="#C45C26" stroke-width="2.5"/>
  <rect x="150" y="402" width="120" height="36" rx="8" fill="#FFF4EC" stroke="#C45C26" stroke-width="1.5"/>
  <text x="210" y="425" text-anchor="middle" font-size="13" fill="#C45C26">total += price</text>
  <path d="M150,420 H70 V277 H95" fill="none" stroke="#C45C26" stroke-width="3" marker-end="url(#fw-b)"/>
  <text x="58" y="360" font-size="12" font-weight="700" fill="#C45C26" transform="rotate(-90 58 360)">内层回流</text>

  <text x="148" y="392" font-size="13" font-weight="700" fill="#1F7A4D">是</text>
  <line x1="190" y1="374" x2="190" y2="458" stroke="#1F7A4D" stroke-width="2.5" marker-end="url(#fw-g)"/>
  <text x="190" y="472" text-anchor="middle" font-size="12" fill="#1F7A4D">本顾客扫完</text>

  <rect x="95" y="490" width="190" height="30" rx="10" fill="#FFF" stroke="#D5DDE8"/>
  <text x="190" y="510" text-anchor="middle" font-size="14" fill="#1B3A6B">打印 total</text>

  <path d="M95,505 H40 V176 H90" fill="none" stroke="#1B3A6B" stroke-width="3" marker-end="url(#fw-a)"/>
  <text x="18" y="360" font-size="12" font-weight="700" fill="#1B3A6B" transform="rotate(-90 18 360)">外层回流</text>

  <line x1="190" y1="570" x2="190" y2="592" stroke="#1B3A6B" stroke-width="2" marker-end="url(#fw-a)"/>
  <rect x="140" y="594" width="100" height="30" rx="15" fill="#E8EEF8" stroke="#1B3A6B" stroke-width="2"/>
  <text x="190" y="614" text-anchor="middle" font-size="14" font-weight="600" fill="#1B3A6B">结束</text>
</svg>
