<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 640" font-family="PingFang SC, sans-serif">
  <rect width="380" height="640" rx="20" fill="#F4F7FB"/>
  <defs>
    <marker id="ww-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1B3A6B"/></marker>
    <marker id="ww-b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#C45C26"/></marker>
    <marker id="ww-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F7A4D"/></marker>
  </defs>
  <text x="190" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1B3A6B">while + while</text>
  <rect x="140" y="38" width="100" height="30" rx="15" fill="#E8EEF8" stroke="#1B3A6B" stroke-width="2"/>
  <text x="190" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#1B3A6B">开始</text>
  <line x1="190" y1="68" x2="190" y2="86" stroke="#1B3A6B" stroke-width="2" marker-end="url(#ww-a)"/>
  <rect x="100" y="88" width="180" height="32" rx="10" fill="#FFF" stroke="#D5DDE8"/>
  <text x="190" y="109" text-anchor="middle" font-size="14" fill="#1B3A6B">读入 n，i = 0</text>
  <line x1="190" y1="120" x2="190" y2="140" stroke="#1B3A6B" stroke-width="2" marker-end="url(#ww-a)"/>
  <rect x="24" y="142" width="332" height="428" rx="16" fill="#EAF3FF" stroke="#1B3A6B" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="40" y="164" font-size="13" font-weight="700" fill="#1B3A6B">外层 while：还有顾客？</text>
  <path d="M190,176 L228,204 L190,232 L152,204 Z" fill="#FFF" stroke="#1B3A6B" stroke-width="2"/>
  <text x="190" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#1B3A6B">i &lt; n?</text>
  <text x="242" y="200" font-size="12" font-weight="700" fill="#1B3A6B">否</text>
  <path d="M228,204 H320 V596 H240" fill="none" stroke="#1B3A6B" stroke-width="2" marker-end="url(#ww-a)"/>
  <text x="202" y="250" font-size="12" font-weight="700" fill="#1B3A6B">是</text>
  <line x1="190" y1="232" x2="190" y2="252" stroke="#1B3A6B" stroke-width="2" marker-end="url(#ww-a)"/>
  <rect x="95" y="254" width="190" height="28" rx="10" fill="#FFF" stroke="#D5DDE8"/>
  <text x="190" y="273" text-anchor="middle" font-size="14" fill="#1B3A6B">total = 0</text>
  <line x1="190" y1="282" x2="190" y2="300" stroke="#1B3A6B" stroke-width="2" marker-end="url(#ww-a)"/>
  <rect x="48" y="302" width="284" height="200" rx="14" fill="#FFF7F0" stroke="#C45C26" stroke-width="2.5"/>
  <text x="64" y="324" font-size="13" font-weight="700" fill="#C45C26">内层 while：扫码</text>
  <rect x="95" y="336" width="190" height="28" rx="10" fill="#FFF" stroke="#D5DDE8"/>
  <text x="190" y="355" text-anchor="middle" font-size="14" fill="#1B3A6B">读入 price</text>
  <line x1="190" y1="364" x2="190" y2="382" stroke="#1B3A6B" stroke-width="2" marker-end="url(#ww-a)"/>
  <path d="M190,384 L224,410 L190,436 L156,410 Z" fill="#FFF" stroke="#1B3A6B" stroke-width="2"/>
  <text x="190" y="414" text-anchor="middle" font-size="12" font-weight="600" fill="#1B3A6B">price==0?</text>
  <text x="236" y="408" font-size="12" font-weight="700" fill="#C45C26">否</text>
  <path d="M224,410 H290 V450 H210" fill="none" stroke="#C45C26" stroke-width="2.5"/>
  <rect x="150" y="452" width="120" height="30" rx="8" fill="#FFF4EC" stroke="#C45C26"/>
  <text x="210" y="472" text-anchor="middle" font-size="12" fill="#C45C26">total += price</text>
  <path d="M150,467 H70 V350 H95" fill="none" stroke="#C45C26" stroke-width="3" marker-end="url(#ww-b)"/>
  <text x="58" y="420" font-size="12" font-weight="700" fill="#C45C26" transform="rotate(-90 58 420)">内层回流</text>
  <text x="148" y="452" font-size="12" font-weight="700" fill="#1F7A4D">是</text>
  <line x1="190" y1="436" x2="190" y2="520" stroke="#1F7A4D" stroke-width="2.5" marker-end="url(#ww-g)"/>
  <rect x="95" y="522" width="190" height="28" rx="10" fill="#FFF" stroke="#D5DDE8"/>
  <text x="190" y="541" text-anchor="middle" font-size="14" fill="#1B3A6B">打印 total，i += 1</text>
  <path d="M95,536 H40 V204 H152" fill="none" stroke="#1B3A6B" stroke-width="3" marker-end="url(#ww-a)"/>
  <text x="18" y="380" font-size="12" font-weight="700" fill="#1B3A6B" transform="rotate(-90 18 380)">外层回流</text>
  <rect x="140" y="598" width="100" height="28" rx="14" fill="#E8EEF8" stroke="#1B3A6B" stroke-width="2"/>
  <text x="190" y="617" text-anchor="middle" font-size="14" font-weight="600" fill="#1B3A6B">结束</text>
</svg>
