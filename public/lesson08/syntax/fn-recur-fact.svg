, monospace" xml:space="preserve">4 * 6 = 24</text><path d="M144.0 220.0 L178.0 244.0" fill="none" stroke="#1B3A6B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#m-navy)"/><path d="M640.0 240.0 L640.0 220.0" fill="none" stroke="#D9822B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#m-orange)"/><rect x="128.0" y="244.0" width="150.0" height="46.0" rx="10" fill="#E8EEF8" stroke="#1B3A6B" stroke-width="2.5"/><text x="203.0" y="274.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1B3A6B" font-family="Menlo, Consolas, monospace" xml:space="preserve">fact(3)</text><text x="298.0" y="274.0" text-anchor="start" font-size="17" fill="#4A5A75" font-family="Menlo, Consolas, monospace" xml:space="preserve">3 * fact(2)</text><text x="770.0" y="274.0" text-anchor="end" font-size="19" font-weight="700" fill="#D9822B" font-family="Menlo, Consolas, monospace" xml:space="preserve">3 * 2 = 6</text><path d="M178.0 290.0 L212.0 314.0" fill="none" stroke="#1B3A6B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#m-navy)"/><path d="M640.0 310.0 L640.0 290.0" fill="none" stroke="#D9822B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#m-orange)"/><rect x="162.0" y="314.0" width="150.0" height="46.0" rx="10" fill="#E8EEF8" stroke="#1B3A6B" stroke-width="2.5"/><text x="237.0" y="344.0" text-anchor="middle" font-size="20" font-weight="700" fill="#1B3A6B" font-family="Menlo, Consolas, monospace" xml:space="preserve">fact(2)</text><text x="332.0" y="344.0" text-anchor="start" font-size="17" fill="#4A5A75" font-family="Menlo, Consolas, monospace" xml:space="preserve">2 * fact(1)</text><text x="770.0" y="344.0" text-anchor="end" font-size="19" font-weight="700" fill="#D9822B" font-family="Menlo, Consolas, monospace" xml:space="preserve">2 * 1 = 2</text><path d="M212.0 360.0 L246.0 384.0" fill="none" stroke="#1B3A6B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#m-navy)"/><path d="M640.0 380.0 L640.0 360.0" fill="none" stroke="#D9822B" stroke-width="2.5" stroke-linecap="round" marker-end="url(#m-orange)"/><rect x="196.0" y="384.0" width="150.0" height="46.0" rx="10" fill="#E3F3EA" stroke="#2E8B57" stroke-width="2.5"/><text x="271.0" y="414.0" text-anchor="middle" font-size="20" font-weight="700" fill="#2E8B57" font-family="Menlo, Consolas, monospace" xml:space="preserve">fact(1)</text><text x="366.0" y="414.0" text-anchor="start" font-size="17" font-weight="700" fill="#2E8B57" font-family="Menlo, Consolas, monospace" xml:space="preserve">n &lt;= 1</text><text x="770.0" y="414.0" text-anchor="end" font-size="19" font-weight="700" fill="#D9822B" font-family="Menlo, Consolas, monospace" xml:space="preserve">return 1</text><text x="496.0" y="414.0" text-anchor="start" font-size="17" font-weight="700" fill="#2E8B57" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve">← 终止条件</text>
