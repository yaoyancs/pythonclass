<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
<defs><marker id="m-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1B3A6B"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E8B57"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9822B"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C0392B"/></marker><marker id="m-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A97AB"/></marker></defs>
<style>
svg &gt; path {
  stroke-dasharray: 1000;
  stroke-dashoffset: 1000;
  animation: draw-flow 6s ease-in-out infinite;
}
svg &gt; path:nth-of-type(2), svg &gt; path:nth-of-type(4),
svg &gt; path:nth-of-type(6), svg &gt; path:nth-of-type(8) {
  animation-delay: 2.8s;
}
svg &gt; rect:not(:first-of-type) {
  transform-box: fill-box;
  transform-origin: center;
  animation: frame-pulse 6s ease-in-out infinite;
}
svg &gt; rect:nth-of-type(3) { animation-delay: .45s; }
svg &gt; rect:nth-of-type(4) { animation-delay: .9s; }
svg &gt; rect:nth-of-type(5) { animation-delay: 1.35s; }
svg &gt; rect:nth-of-type(6) { animation-delay: 1.8s; }
@keyframes draw-flow {
  0%, 8% { stroke-dashoffset: 1000; opacity: .2; }
  30%, 82% { stroke-dashoffset: 0; opacity: 1; }
  100% { stroke-dashoffset: -1000; opacity: .2; }
}
@keyframes frame-pulse {
  0%, 12%, 100% { transform: scale(1); }
  6% { transform: scale(1.035); }
}
@media (prefers-reduced-motion: reduce) {
  svg &gt; path, svg &gt; rect { animation: none; stroke-dashoffset: 0; }
}
</style>
<rect width="800" height="480" rx="24" fill="#F4F7FB"/>
