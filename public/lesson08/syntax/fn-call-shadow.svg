 x="416.7" y="227.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" font-family="Menlo, Consolas, monospace" xml:space="preserve">GRAVITY</text><path d="M540.0 250.0 L610.0 250.0" fill="none" stroke="#D9822B" stroke-width="3" stroke-linecap="round" marker-end="url(#m-orange)"/><rect x="629.0" y="230.0" width="72.0" height="40.0" rx="10" fill="#FCEBD9" stroke="#D9822B" stroke-width="2.5"/><text x="665.0" y="257.2" text-anchor="middle" font-size="20" font-weight="700" fill="#D9822B" font-family="Menlo, Consolas, monospace" xml:space="preserve">3.24</text><text x="540.0" y="300.0" text-anchor="middle" font-size="17" fill="#4A5A75" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve">名字相同，却是两个不同的变量</text><text x="60.0" y="380.0" text-anchor="start" font-size="21" font-weight="700" fill="#1B3A6B" font-family="Menlo, Consolas, monospace" xml:space="preserve">print(GRAVITY)</text><path d="M150.0 360.0 L150.0 206.0" fill="none" stroke="#2E8B57" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#m-green)"/><text x="250.0" y="380.0" text-anchor="start" font-size="21" font-weight="700" fill="#2E8B57" font-family="Menlo, Consolas, monospace" xml:space="preserve">→ 9.8</text><text x="400.0" y="424.0" text-anchor="middle" font-size="18" fill="#4A5A75" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve">函数里赋值只影响局部，全局的 GRAVITY 没有被改</text>
