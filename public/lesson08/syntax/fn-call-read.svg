<rect width="800" height="480" rx="24" fill="#F4F7FB"/>
<text x="400.0" y="40.0" text-anchor="middle" font-size="26" font-weight="700" fill="#1B3A6B" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve">全局变量：函数内可以直接读取</text><rect x="30.0" y="76.0" width="740.0" height="370.0" rx="16" fill="#fff" stroke="#1B3A6B" stroke-width="2.5"/><rect x="44.0" y="61.0" width="146.0" height="30.0" rx="8" fill="#1B3A6B"/><text x="117.0" y="82.0" text-anchor="middle" font-size="18" font-weight="700" fill="#fff" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve">函数外（全局）</text><rect x="65.0" y="142.0" width="170.0" height="56.0" rx="10" fill="#fff" stroke="#1B3A6B" stroke-width="2.5"/><text x="150.0" y="178.0" text-anchor="middle" font-size="22" font-weight="700" fill="#D9822B" font-family="Menlo, Consolas, monospace" xml:space="preserve">9.8</text><rect x="73.0" y="128.0" width="87.4" height="26.0" rx="6" fill="#1B3A6B"/><text x="116.7" y="147.0" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" font-family="Menlo, Consolas, monospace" xml:space="preserve">GRAVITY</text><rect x="300.0" y="120.0" width="450.0" height="190.0" rx="16" fill="#E8EEF8" stroke="#1B3A6B" stroke-width="2.5"/><rect x="314.0" y="105.0" width="151.0" height="30.0" rx="8" fill="#1B3A6B"/><text x="389.5" y="126.0" text-anchor="middle" font-size="18" font-weight="700" fill="#fff" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve">earth_drop(t)</text><text x="320.0" y="210.0" text-anchor="start" font-size="17" font-weight="700" fill="#1B3A6B" font-family="Menlo, Consolas, monospace" xml:space="preserve">return round(0.5 * GRAVITY * t * t, 2)</text><line x1="513.8" y1="220.0" x2="585.2" y2="220.0" stroke="#2E8B57" stroke-width="3.5" stroke-linecap="round"/><path d="M549.5 226.0 Q549.5 290.0 240.0 190.0" fill="none" stroke="#2E8B57" stroke-width="3" stroke-linecap="round" marker-end="url(#m-green)"/><text x="525.0" y="270.0" text-anchor="middle" font-size="17" font-weight="700" fill="#2E8B57" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve">函数内没有 GRAVITY，就到外面找</text><text x="400.0" y="372.0" text-anchor="middle" font-size="19" font-weight="700" fill="#D9822B" font-family="Menlo, Consolas, monospace" xml:space="preserve">earth_drop(2) → 19.6        earth_drop(3) → 44.1</text><text x="400.0" y="418.0" text-anchor="middle" font-size="18" fill="#4A5A75" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve">只读取、不赋值，用的就是全局的 GRAVITY</text>
</svg>
