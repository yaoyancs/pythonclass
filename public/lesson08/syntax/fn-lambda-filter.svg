<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
<defs><marker id="m-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1B3A6B"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E8B57"/></marker><marker id="m-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D9822B"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C0392B"/></marker><marker id="m-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A97AB"/></marker></defs>
<rect width="800" height="480" rx="24" fill="#F4F7FB"/>
<text x="400.0" y="40.0" text-anchor="middle" font-size="26" font-weight="700" fill="#1B3A6B" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve">lambda 参数: 表达式</text><rect x="250.0" y="64.0" width="252.0" height="89.2" rx="14" fill="#fff" stroke="#1B3A6B" stroke-width="2.5"/><text x="268.0" y="98.0" text-anchor="start" font-size="20" fill="#1B3A6B" font-family="Menlo, Consolas, monospace" xml:space="preserve">def is_hot(t):</text><text x="268.0" y="130.0" text-anchor="start" font-size="20" fill="#1B3A6B" font-family="Menlo, Consolas, monospace" xml:space="preserve">    return t &gt;= 35</text><path d="M370 160 h60 v26 h28 l-58 40 l-58 -40 h28 z" fill="#2E8B57"/><text x="470.0" y="196.0" text-anchor="start" font-size="17" font-weight="700" fill="#2E8B57" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve">写成一行</text><text x="206.2" y="280.0" text-anchor="start" font-size="38" font-weight="700" fill="#1B3A6B" font-family="Menlo, Consolas, monospace" xml:space="preserve">lambda t: t &gt;= 35</text><line x1="208.2" y1="290.0" x2="341.0" y2="290.0" stroke="#1B3A6B" stroke-width="3.5" stroke-linecap="round"/><path d="M274.6 310.0 L274.6 298.0" fill="none" stroke="#1B3A6B" stroke-width="2" stroke-linecap="round" marker-end="url(#m-navy)"/><text x="274.6" y="330.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1B3A6B" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve">关键字</text><line x1="367.8" y1="290.0" x2="386.6" y2="290.0" stroke="#2E8B57" stroke-width="3.5" stroke-linecap="round"/><path d="M377.2 310.0 L377.2 298.0" fill="none" stroke="#2E8B57" stroke-width="2" stroke-linecap="round" marker-end="url(#m-green)"/><text x="377.2" y="330.0" text-anchor="middle" font-size="18" font-weight="700" fill="#2E8B57" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve">参数</text><line x1="436.2" y1="290.0" x2="591.8" y2="290.0" stroke="#D9822B" stroke-width="3.5" stroke-linecap="round"/><path d="M514.0 310.0 L514.0 298.0" fill="none" stroke="#D9822B" stroke-width="2" stroke-linecap="round" marker-end="url(#m-orange)"/><text x="514.0" y="330.0" text-anchor="middle" font-size="18" font-weight="700" fill="#D9822B" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve">返回值（自动 return）</text><text x="400.0" y="418.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1B3A6B" font-family="Menlo, Consolas, monospace" xml:space="preserve">filter(lambda t: t &gt;= 35, temps)  →  [36, 38, 35]</text><text x="400.0" y="456.0" text-anchor="middle" font-size="17" fill="#4A5A75" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve">没有名字、只有一个表达式，适合只用一次的小函数</text>
</svg>
