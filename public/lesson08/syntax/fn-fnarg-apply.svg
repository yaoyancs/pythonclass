 text-anchor="middle" font-size="15" fill="#4A5A75" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve">也可以换成</text><path d="M250.0 131.0 L250.0 196.0" fill="none" stroke="#2E8B57" stroke-width="3" stroke-linecap="round" marker-end="url(#m-green)"/><path d="M530.0 133.0 L530.0 196.0" fill="none" stroke="#1B3A6B" stroke-width="3" stroke-linecap="round" marker-end="url(#m-navy)"/><rect x="130.0" y="220.0" width="500.0" height="120.0" rx="18" fill="#E8EEF8" stroke="#1B3A6B" stroke-width="3"/><text x="610.0" y="318.0" text-anchor="end" font-size="20" font-weight="700" fill="#1B3A6B" font-family="Menlo, Consolas, monospace" xml:space="preserve">apply_rule()</text><rect x="214.2" y="198.0" width="71.6" height="44.0" rx="10" fill="#fff" stroke="#1B3A6B" stroke-width="2.5"/><text x="250.0" y="227.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1B3A6B" font-family="Menlo, Consolas, monospace" xml:space="preserve">text</text><rect x="494.2" y="198.0" width="71.6" height="44.0" rx="10" fill="#fff" stroke="#1B3A6B" stroke-width="2.5"/><text x="530.0" y="227.0" text-anchor="middle" font-size="19" font-weight="700" fill="#1B3A6B" font-family="Menlo, Consolas, monospace" xml:space="preserve">rule</text><rect x="362.0" y="338.0" width="36.0" height="24.0" rx="6" fill="#fff" stroke="#1B3A6B" stroke-width="2.5"/><text x="160.0" y="288.0" text-anchor="start" font-size="20" font-weight="700" fill="#D9822B" font-family="Menlo, Consolas, monospace" xml:space="preserve">return rule(text)</text><path d="M380.0 362.0 L380.0 386.0" fill="none" stroke="#D9822B" stroke-width="3" stroke-linecap="round" marker-end="url(#m-orange)"/><rect x="293.9" y="392.0" width="172.2" height="40.0" rx="10" fill="#FCEBD9" stroke="#D9822B" stroke-width="2.5"/><text x="380.0" y="418.8" text-anchor="middle" font-size="19" font-weight="700" fill="#D9822B" font-family="Menlo, Consolas, monospace" xml:space="preserve">"Python_3.12"</text><text x="510.0" y="418.0" text-anchor="middle" font-size="16" fill="#1B3A6B" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve"></text><text x="400.0" y="466.0" text-anchor="middle" font-size="17" fill="#4A5A75" font-family="PingFang SC, Microsoft YaHei, sans-serif" xml:space="preserve">rule 接住哪个函数，rule(text) 就执行哪个函数</text>
